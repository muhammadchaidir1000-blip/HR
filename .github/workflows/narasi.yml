name: ambil-narasi
on:
  push:
    branches: [tmp-narasi]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p audio
          while read -r name url; do [ -n "$name" ] && curl -fsSL "$url" -o "audio/$name.mp3"; done < urls.txt
          git config user.name narasi-bot; git config user.email narasi-bot@users.noreply.github.com
          git add audio && git commit -m "audio [skip ci]" && git push
