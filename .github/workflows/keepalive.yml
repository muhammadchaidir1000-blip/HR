name: Supabase keep-alive
on:
  schedule:
    - cron: "0 3 */3 * *"   # tiap 3 hari
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping semua proyek
        run: |
          ping() {  # nama url key
            echo "== $1"
            c1=$(curl -s -o /dev/null -w "%{http_code}" "$2/rest/v1/" -H "apikey: $3" -H "Authorization: Bearer $3")
            c2=$(curl -s -o /dev/null -w "%{http_code}" "$2/auth/v1/health" -H "apikey: $3")
            echo "data=$c1 auth=$c2"
            case "$c1" in 5*|000) echo "GAGAL: $1"; return 1;; esac
          }
          fail=0
          ping "pantau-biaya-korporat" "https://acwausnccjmlyfdmmgfo.supabase.co" "sb_publishable_Jn_K2mOz7uaX1VrolAvgOQ_FxEfTIHq" || fail=1
          ping "unitcost-medisin" "https://jwcmfoiqshrrkezjzboy.supabase.co" "sb_publishable_XyvTDcVoz6OokpUpPG7yrA_AtzLysE5" || fail=1
          # HR manajemen: memanggil fungsi yang membaca database
          echo "== HR manajemen"
          c=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://jgwxnaytgaqkwqzlmdgt.supabase.co/rest/v1/rpc/needs_setup" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnd3huYXl0Z2Fxa3dxemxtZGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTQxMjAsImV4cCI6MjEwNzk3MDEyMH0.7mpAfMsSn9PbJZbxrPPK-uUPB1kbdhZKiW8a2xqIhRk" \
            -H "Content-Type: application/json" -d '{}')
          echo "rpc=$c"; [ "$c" = "200" ] || fail=1
          exit $fail
